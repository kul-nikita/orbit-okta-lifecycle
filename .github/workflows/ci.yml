name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v
      - name: Build Docker image
        run: |
          docker build -t orbit:ci .
      - name: Smoke-test Docker image (check Streamlit import)
        run: |
          docker run --rm --env-file .env.example orbit:ci python -c "import streamlit,sys; print('streamlit', streamlit.__version__); sys.exit(0)"
